<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>NPC Idle Polish v1 Review</title>
  <style>
    :root { color-scheme: dark; font-family: Inter, "Segoe UI", sans-serif; background:#0f0d14; color:#f6e7c0; }
    body { margin:0; padding:24px; }
    h1 { margin:0 0 8px; font-size:26px; }
    p { margin:0 0 22px; color:#bfb5ca; }
    main { display:grid; grid-template-columns:repeat(auto-fit,minmax(320px,1fr)); gap:18px; }
    article { background:#17131e; border:1px solid #3d314a; border-radius:16px; padding:14px; box-shadow:0 14px 30px #0008; }
    h2 { margin:0 0 10px; font-size:18px; }
    img { display:block; width:100%; max-width:448px; margin:auto; border-radius:10px; image-rendering:auto; }
    .supplied { color:#ffd56b; }
    .new { color:#c997ff; }
  </style>
</head>
<body>
  <h1>NPC Idle Polish v1</h1>
  <p>Preview-only. 4-second loops; checkerboard exposes alpha edges.</p>
  <main>
    <article><h2 class="supplied">Money Monster — supplied polish</h2><img src="money-monster-idle-preview.webp" alt="Money Monster idle"></article>
    <article><h2 class="supplied">Bobo Merchant — supplied polish</h2><img src="bobo-merchant-idle-preview.webp" alt="Bobo Merchant idle"></article>
    <article><h2 class="new">Player Upgrades — new idle</h2><img src="player-upgrades-idle-preview.webp" alt="Player Upgrades idle"></article>
    <article><h2 class="new">Gear Merchant — new idle</h2><img src="gear-merchant-idle-preview.webp" alt="Gear Merchant idle"></article>
    <article><h2 class="new">Gem Power Merchant — new idle</h2><img src="gem-power-merchant-idle-preview.webp" alt="Gem Power Merchant idle"></article>
  </main>
</body>
</html>

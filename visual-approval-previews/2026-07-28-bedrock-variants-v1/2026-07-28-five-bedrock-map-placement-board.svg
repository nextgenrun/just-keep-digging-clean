      <rect x="504" y="94" width="231" height="156" fill="url(#l2)"/>
      <rect x="192" y="70" width="408" height="24" fill="#687984" stroke="#d3dde2"/>
      <rect x="168" y="46" width="24" height="24" fill="url(#p1)" stroke="#ffd278" stroke-width="2"/>
      <rect x="480" y="118" width="24" height="132" fill="url(#p1)" stroke="#82eaff" stroke-width="2"/>
      <rect x="480" y="94" width="24" height="24" fill="#061018" stroke="#7ff0ba" stroke-dasharray="4 3"/>
      <path d="M55 58H158M200 58H670" stroke="#7de6ff" stroke-width="4" marker-end="url(#arrow)" filter="url(#cyanGlow)"/>
      <text x="180" y="36" text-anchor="middle" class="coord">GATE x119/y64</text>
      <text x="396" y="88" text-anchor="middle" class="small">BRIDGE x120..136 / y65</text>
      <text x="514" y="113" class="ok">OPEN y66</text>
      <text x="516" y="143" class="coord">x132 starts y67</text>
      <text x="55" y="82" class="label">LEVEL 1</text>
      <text x="625" y="82" class="label">LEVEL 2</text>
    </g>
    <g transform="translate(1190 92)">
      <rect width="500" height="250" rx="10" fill="#061018"/>
      <rect x="50" y="35" width="180" height="180" fill="url(#l1)"/>
      <rect x="238" y="35" width="212" height="180" fill="url(#l2)"/>
      <rect x="230" y="36" width="8" height="179" fill="url(#p1)" stroke="#8ceaff"/>
      <text x="140" y="70" text-anchor="middle" class="label">LEVEL 1</text>
      <text x="344" y="70" text-anchor="middle" class="label">LEVEL 2</text>
      <text x="254" y="130" transform="rotate(90 254 130)" text-anchor="middle" class="coord">x132 / y67..5064</text>
      <text x="250" y="238" text-anchor="middle" class="ok">ONE TILE • NO GAPS</text>
    </g>
  </g>


<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="2380" viewBox="0 0 1800 2380">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#08131d"/>
      <stop offset="1" stop-color="#03080d"/>
    </linearGradient>
    <linearGradient id="l1" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#715636"/>
      <stop offset="1" stop-color="#30251b"/>
    </linearGradient>
    <linearGradient id="l2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#843723"/>
      <stop offset="1" stop-color="#2a1113"/>
    </linearGradient>
    <pattern id="p1" width="180" height="180" patternUnits="userSpaceOnUse">
      <image href="01-megalith-lock.png" width="180" height="180" preserveAspectRatio="xMidYMid slice"/>
    </pattern>
    <pattern id="p2" width="180" height="180" patternUnits="userSpaceOnUse">
      <image href="02-titan-forge-seal.png" width="180" height="180" preserveAspectRatio="xMidYMid slice"/>
    </pattern>
    <pattern id="p3" width="180" height="180" patternUnits="userSpaceOnUse">
      <image href="03-abyss-scale.png" width="180" height="180" preserveAspectRatio="xMidYMid slice"/>
    </pattern>
    <pattern id="p4" width="180" height="180" patternUnits="userSpaceOnUse">
      <image href="04-pressure-strata.png" width="180" height="180" preserveAspectRatio="xMidYMid slice"/>
    </pattern>
    <pattern id="p5" width="180" height="180" patternUnits="userSpaceOnUse">
      <image href="05-worldcore-lattice.png" width="180" height="180" preserveAspectRatio="xMidYMid slice"/>
    </pattern>
    <filter id="cyanGlow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="9" refY="6" orient="auto">
      <path d="M0 0L12 6L0 12Z" fill="#7de6ff"/>
    </marker>
    <style>
      .title{font:800 42px system-ui,Segoe UI,sans-serif;letter-spacing:2px;fill:#f1f8fc}
      .sub{font:500 18px system-ui,Segoe UI,sans-serif;fill:#9db6c6}
      .option{font:800 25px system-ui,Segoe UI,sans-serif;letter-spacing:1px;fill:#edf7fc}
      .desc{font:500 16px system-ui,Segoe UI,sans-serif;fill:#a9c0ce}
      .label{font:700 16px system-ui,Segoe UI,sans-serif;fill:#e7f1f7}
      .small{font:600 13px system-ui,Segoe UI,sans-serif;fill:#a8bdca}
      .coord{font:800 14px ui-monospace,SFMono-Regular,Consolas,monospace;fill:#ffd278}
      .ok{font:800 15px system-ui,Segoe UI,sans-serif;fill:#7ff0ba}
    </style>
  </defs>

  <rect width="1800" height="2380" fill="url(#bg)"/>
  <text x="70" y="72" class="title">FIVE BEDROCK DIRECTIONS — EXACT MAP PLACEMENT</text>
  <text x="72" y="108" class="sub">Review only • no option is wired into runtime • compare the texture at tile scale and across the full divider</text>

  <rect x="65" y="145" width="1670" height="115" rx="18" fill="#0d1c27" stroke="#29495d" stroke-width="2"/>
  <text x="95" y="184" class="coord">ONLY BEDROCK UNDERGROUND:</text>
  <text x="370" y="184" class="label">one continuous tile column at x132 from y67 through y5064</text>
  <text x="95" y="220" class="coord">ONLY LEVEL CROSSING:</text>
  <text x="328" y="220" class="label">locked gate x119/y64 → bridge x120..136/y65 → Level 2 surface</text>
  <text x="1220" y="202" class="ok">ALL OTHER UNDERGROUND BEDROCK REMOVED</text>

  <!-- Row backgrounds -->
  <g fill="#0b1822" stroke="#26485d" stroke-width="2">
    <rect x="55" y="290" width="1690" height="380" rx="18"/>
    <rect x="55" y="700" width="1690" height="380" rx="18"/>
    <rect x="55" y="1110" width="1690" height="380" rx="18"/>
    <rect x="55" y="1520" width="1690" height="380" rx="18"/>
    <rect x="55" y="1930" width="1690" height="380" rx="18"/>
  </g>


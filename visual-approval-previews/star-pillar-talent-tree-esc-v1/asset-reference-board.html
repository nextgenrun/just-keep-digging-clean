<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Starlight Talent Tree Asset Reference</title>
  <style>
    :root {
      color-scheme: dark;
      font-family: "Arial Narrow", "Segoe UI", sans-serif;
      background: #03070c;
      color: #edf8ff;
    }

    * {
      box-sizing: border-box;
    }

    body {
      width: 1280px;
      min-height: 720px;
      margin: 0;
      padding: 30px 36px;
      overflow: hidden;
      background:
        radial-gradient(circle at 50% 105%, #17304a 0, transparent 45%),
        linear-gradient(145deg, #071019, #020509 70%);
    }

    h1,
    h2,
    p {
      margin: 0;
    }

    header {
      display: flex;
      align-items: end;
      justify-content: space-between;
      margin-bottom: 20px;
      border-bottom: 1px solid #274052;
      padding-bottom: 15px;
    }

    h1 {
      color: #f8e4b8;
      font-size: 28px;
      letter-spacing: 3px;
    }

    header p {
      color: #8daec0;
      font: 13px Consolas, monospace;
      letter-spacing: 1px;
    }

    main {
      display: grid;
      grid-template-columns: 1.45fr 1fr;
      gap: 24px;
    }

    section {
      min-height: 585px;
      padding: 18px;
      border: 1px solid #294152;
      border-radius: 12px;
      background: rgba(7, 15, 23, 0.86);
      box-shadow: inset 0 0 24px rgba(40, 170, 220, 0.05);
    }

    h2 {
      margin-bottom: 14px;
      color: #71dcff;
      font-size: 16px;
      letter-spacing: 2px;
    }

    .signs {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 12px;
    }

    figure {
      margin: 0;
    }

    .sign {
      display: grid;
      place-items: center;
      min-height: 238px;
      padding: 9px;
      border: 1px solid #233747;
      border-radius: 10px;
      background:
        radial-gradient(circle at 50% 38%, rgba(64, 197, 255, 0.1), transparent 54%),
        #07111a;
    }

    .sign img {
      width: 108px;
      height: 162px;
      object-fit: contain;
      filter: drop-shadow(0 0 12px rgba(80, 210, 255, 0.22));
    }

    figcaption {
      color: #c9dce7;
      font: 12px Consolas, monospace;
      letter-spacing: 0.5px;
      text-align: center;
      text-transform: uppercase;
    }

    .engines {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 14px;
    }

    .engine {
      display: grid;
      place-items: center;
      min-height: 250px;
      padding: 12px;
      border: 1px solid #3b354e;
      border-radius: 12px;
      background:
        radial-gradient(circle at 50% 45%, rgba(169, 109, 255, 0.12), transparent 56%),
        #080d16;
    }

    .engine img {
      width: 158px;
      height: 170px;
      object-fit: contain;
      filter: drop-shadow(0 0 17px rgba(145, 195, 255, 0.22));
    }
  </style>
</head>
<body>
  <header>
    <div>
      <h1>EXACT PROJECT ART</h1>
      <p>CONSTELLATION SIGNS + STAR HEART + CELESTIAL ENGINES</p>
    </div>
    <p>REVIEW REFERENCE • NOT RUNTIME</p>
  </header>
  <main>
    <section>
      <h2>THE TEN CONSTELLATIONS</h2>
      <div class="signs">
        <figure class="sign"><img src="../../sprites/constellations/star-signs-v2/dirt-shovel.png"><figcaption>The Shovel</figcaption></figure>
        <figure class="sign"><img src="../../sprites/constellations/star-signs-v2/copper-anvil.png"><figcaption>The Anvil</figcaption></figure>
        <figure class="sign"><img src="../../sprites/constellations/star-signs-v2/steel-sword.png"><figcaption>The Sword</figcaption></figure>
        <figure class="sign"><img src="../../sprites/constellations/star-signs-v2/bronze-shield.png"><figcaption>The Shield</figcaption></figure>
        <figure class="sign"><img src="../../sprites/constellations/star-signs-v2/silver-crescent.png"><figcaption>The Crescent</figcaption></figure>
        <figure class="sign"><img src="../../sprites/constellations/star-signs-v2/stone-mountain.png"><figcaption>The Mountain</figcaption></figure>
        <figure class="sign"><img src="../../sprites/constellations/star-signs-v2/darkDirtNormal-cave.png"><figcaption>The Cave</figcaption></figure>
        <figure class="sign"><img src="../../sprites/constellations/star-signs-v2/iron-hammer.png"><figcaption>The Hammer</figcaption></figure>
        <figure class="sign"><img src="../../sprites/constellations/star-signs-v2/darkDirtStrong-fortress.png"><figcaption>The Fortress</figcaption></figure>
        <figure class="sign"><img src="../../sprites/constellations/star-signs-v2/gold-crown.png"><figcaption>The Crown</figcaption></figure>
      </div>
    </section>
    <section>
      <h2>THE HEART AND ITS THREE FINAL CHOICES</h2>
      <div class="engines">
        <figure class="engine"><img src="../../sprites/celestial-engines/star-heart-core-v1.png"><figcaption>Star Heart</figcaption></figure>
        <figure class="engine"><img src="../../sprites/celestial-engines/wayward-star-core-v1.png"><figcaption>Wayward Star</figcaption></figure>
        <figure class="engine"><img src="../../sprites/celestial-engines/hollow-sun-core-v1.png"><figcaption>Hollow Sun</figcaption></figure>
        <figure class="engine"><img src="../../sprites/celestial-engines/comet-engine-core-v1.png"><figcaption>Comet Engine</figcaption></figure>
      </div>
    </section>
  </main>
</body>
</html>

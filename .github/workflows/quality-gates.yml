name: Dig Game Safety Gates

on:
  pull_request:
  push:
    branches:
      - main
      - "codex/**"
  merge_group:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:
    inputs:
      canary_url:
        description: Optional deployed canary URL to probe after local validation
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: dig-game-safety-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  FORCE_COLOR: "0"
  NO_COLOR: "1"
  PYTHONUTF8: "1"

jobs:
  structural-health:
    name: Structural health
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out candidate
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Use Node 24
        uses: actions/setup-node@v6
        with:
          node-version: "24"

      - name: Validate the complete runtime module graph
        run: node testing/2026-07-22-all-game-systems-health-check.mjs

      - name: Enforce architecture no-regression baselines
        run: node testing/2026-08-12-architecture-ratchet.mjs

      - name: Validate the live boot asset queue
        run: node testing/2026-07-26-boot-live-asset-health-contract.mjs

      - name: Validate release-safety wiring
        run: node testing/2026-07-25-release-safety-contract.mjs

      - name: Validate immutable demo capabilities
        run: |
          node testing/2026-08-12-gameplay-capabilities-contract.mjs
          node testing/2026-08-11-demo-mode-contract.mjs

  demo-release:
    name: Demo release (strict)
    needs: structural-health
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out candidate
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Use Node 24
        uses: actions/setup-node@v6
        with:
          node-version: "24"

      - name: Use Python 3.13
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install pinned image-contract dependency
        run: python -m pip install --disable-pip-version-check Pillow==12.3.0

      - name: Run strict demo contracts
        run: python testing/2026-07-22-deep-game-logic-health.py --lane demo-release --timeout 90

  full-compat:
    name: Full-game compatibility ratchet
    needs: structural-health
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out candidate
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Use Node 24
        uses: actions/setup-node@v6
        with:
          node-version: "24"

      - name: Use Python 3.13
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Reject new or changed full-game failures
        run: python testing/2026-07-22-deep-game-logic-health.py --lane full-compat --timeout 90

  artifact-change-detection:
    name: Artifact review scope
    runs-on: ubuntu-latest
    outputs:
      run_artifact: ${{ steps.scope.outputs.run_artifact }}
    steps:
      - name: Check out candidate history
        uses: actions/checkout@v6
        with:
          fetch-depth: 2
          persist-credentials: false

      - name: Detect authored-art and review-contract changes
        id: scope
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          BEFORE_SHA: ${{ github.event.before }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          if [[ "$EVENT_NAME" == "schedule" || "$EVENT_NAME" == "workflow_dispatch" ]]; then
            echo "run_artifact=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          base="$PR_BASE_SHA"
          if [[ -z "$base" ]]; then base="$BEFORE_SHA"; fi
          if [[ -z "$base" || "$base" =~ ^0+$ ]]; then
            echo "run_artifact=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          changed="$(git diff --name-only "$base" "$GITHUB_SHA")"
          if grep -Eq '^(sprites/|testing/animation-sandbox/|testing/blender-animation-lab-v1/|testing/.*(review|piskel|art-contract|native-density|runtime-feature-asset-tiering)|testing/2026-08-12-contract-lanes.json|testing/2026-07-22-deep-game-logic-health.py|values/.*(asset|visual|animation|piskel))' <<< "$changed"; then
            echo "run_artifact=true" >> "$GITHUB_OUTPUT"
          else
            echo "run_artifact=false" >> "$GITHUB_OUTPUT"
          fi

  artifact-review:
    name: Authored artifact ratchet
    needs:
      - structural-health
      - artifact-change-detection
    if: needs.artifact-change-detection.outputs.run_artifact == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out candidate
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Use Node 24
        uses: actions/setup-node@v6
        with:
          node-version: "24"

      - name: Use Python 3.13
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install pinned image-contract dependency
        run: python -m pip install --disable-pip-version-check Pillow==12.3.0

      - name: Reject new or changed artifact failures
        run: python testing/2026-07-22-deep-game-logic-health.py --lane artifact-review --timeout 90

  production-canary:
    name: Production package canary
    needs: demo-release
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out candidate
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Use Python 3.13
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Validate production builder contracts
        run: python testing/2026-07-18-production-deployment-smoke.py

      - name: Build isolated canary package
        run: python tools/2026-07-17-build-production.py --out-dir dist

      - name: Probe canary HTTP and rollback identity
        run: python testing/2026-07-25-production-http-canary.py --directory dist

      - name: Preserve a rollback-ready canary artifact
        if: github.event_name != 'pull_request' && github.event_name != 'merge_group'
        uses: actions/upload-artifact@v7
        with:
          name: dig-game-canary-${{ github.sha }}
          path: dist/
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

  remote-canary:
    name: Optional deployed canary
    needs: structural-health
    if: >-
      (github.event_name == 'schedule' && vars.CANARY_URL != '') ||
      (github.event_name == 'workflow_dispatch' && inputs.canary_url != '')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CANARY_URL: ${{ github.event_name == 'workflow_dispatch' && inputs.canary_url || vars.CANARY_URL }}
    steps:
      - name: Check out canary probe
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Use Python 3.13
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Probe deployed canary without writes
        run: python testing/2026-07-25-production-http-canary.py --url "$CANARY_URL"

  incident-alert:
    name: Safety incident alert
    if: >-
      always() &&
      github.event_name != 'pull_request' &&
      github.event_name != 'merge_group' &&
      github.ref == 'refs/heads/main' &&
      (
        needs.structural-health.result != 'success' ||
        needs.demo-release.result != 'success' ||
        needs.full-compat.result != 'success' ||
        (needs.artifact-review.result != 'success' && needs.artifact-review.result != 'skipped') ||
        needs.production-canary.result != 'success' ||
        (needs.remote-canary.result != 'success' && needs.remote-canary.result != 'skipped')
      )
    needs:
      - structural-health
      - demo-release
      - full-compat
      - artifact-review
      - production-canary
      - remote-canary
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
    steps:
      - name: Open or update the safety incident
        uses: actions/github-script@v8
        env:
          STRUCTURAL_RESULT: ${{ needs.structural-health.result }}
          DEMO_RESULT: ${{ needs.demo-release.result }}
          COMPAT_RESULT: ${{ needs.full-compat.result }}
          ARTIFACT_RESULT: ${{ needs.artifact-review.result }}
          PRODUCTION_RESULT: ${{ needs.production-canary.result }}
          REMOTE_RESULT: ${{ needs.remote-canary.result }}
        with:
          script: |
            const title = "[Automated] Dig Game safety gate failure";
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const body = [
              `Safety workers failed for commit \`${context.sha}\`.`,
              "",
              `- Structural: ${process.env.STRUCTURAL_RESULT}`,
              `- Demo release: ${process.env.DEMO_RESULT}`,
              `- Full compatibility: ${process.env.COMPAT_RESULT}`,
              `- Artifact review: ${process.env.ARTIFACT_RESULT}`,
              `- Production package: ${process.env.PRODUCTION_RESULT}`,
              `- Remote canary: ${process.env.REMOTE_RESULT}`,
              "",
              `[Open workflow run](${runUrl})`,
            ].join("\n");
            const { data: issues } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: "open",
              per_page: 100,
            });
            const existing = issues.find(issue => issue.title === title && !issue.pull_request);
            if (existing) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existing.number,
                body,
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                body,
              });
            }

  safety-gate:
    name: Safety gate
    if: always()
    needs:
      - structural-health
      - demo-release
      - full-compat
      - artifact-review
      - production-canary
      - remote-canary
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Reject any failed or incomplete required worker
        env:
          STRUCTURAL_RESULT: ${{ needs.structural-health.result }}
          DEMO_RESULT: ${{ needs.demo-release.result }}
          COMPAT_RESULT: ${{ needs.full-compat.result }}
          ARTIFACT_RESULT: ${{ needs.artifact-review.result }}
          PRODUCTION_RESULT: ${{ needs.production-canary.result }}
          REMOTE_RESULT: ${{ needs.remote-canary.result }}
        run: |
          test "$STRUCTURAL_RESULT" = "success"
          test "$DEMO_RESULT" = "success"
          test "$COMPAT_RESULT" = "success"
          test "$ARTIFACT_RESULT" = "success" || test "$ARTIFACT_RESULT" = "skipped"
          test "$PRODUCTION_RESULT" = "success"
          test "$REMOTE_RESULT" = "success" || test "$REMOTE_RESULT" = "skipped"

<!doctype html><html lang="en"><head><meta charset="utf-8"><title>Signal · Save-free encounter review</title>
<style>html,body{margin:0;background:#0b121a;color:#d9e8e7;font:13px system-ui}header{padding:10px 16px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}button,select{background:#1b2e3a;color:#f5e6c5;border:1px solid #5f747a;border-radius:5px;padding:7px 10px;cursor:pointer}button:hover{background:#334f5e}iframe{display:block;border:0;width:100%;height:calc(100vh - 162px);min-height:520px}pre{margin:0;padding:9px 16px;max-height:68px;overflow:auto;background:#111e29;white-space:pre-wrap}small{color:#94b8b5}strong{color:#f1d493}</style></head>

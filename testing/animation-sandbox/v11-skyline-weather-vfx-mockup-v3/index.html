<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>V11 skyline · image-generated weather VFX comparison</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="shell">
    <header>
      <p class="eyebrow">Weather VFX comparison · mockup only</p>
      <h1>Imagegen weather pass</h1>
      <p class="lede">The authored skyline stays exact while generated mini-assets replace the procedural weather drawings.</p>
    </header>
    <section class="stage" id="skyline-stage" aria-label="Animated v11 skyline weather VFX comparison">
      <img class="layer base" src="assets/skyline-base-clean.webp" alt="V11 village skyline">
      <canvas class="layer" id="deep-canvas" width="1001" height="430"></canvas>
      <img class="layer town" src="assets/town-foreground.webp" alt="">
      <canvas class="layer" id="rotor-canvas" width="1001" height="430"></canvas>
      <img class="layer windmills" src="assets/windmill-foreground.webp" alt="">
      <canvas class="layer" id="front-canvas" width="1001" height="430"></canvas>
      <div class="layer grade" id="grade"></div>
    </section>
    <section class="controls" aria-label="Mockup controls">
      <label class="toggle"><input id="motion-toggle" type="checkbox" checked> Motion</label>
      <label class="toggle"><input id="cycle-toggle" type="checkbox"> Auto cycle</label>
      <label>VFX <select id="vfx-mode"><option value="imagegen" selected>Imagegen VFX</option><option value="procedural">Procedural</option></select></label>
      <label>Time <input id="time" type="range" min="0" max="24" step="0.1" value="20"><output id="time-value">20:00</output></label>
      <label>Weather <select id="weather"><option value="clear">Clear</option><option value="cloudy">Cloudy</option><option value="rain">Rain</option><option value="storm" selected>Storm</option><option value="fog">Fog</option><option value="snow">Snow</option></select></label>
      <label>Strength <input id="intensity" type="range" min="0.4" max="2" step="0.1" value="1.3"><output id="intensity-value">1.3×</output></label>
    </section>
    <p class="status" id="status">20:00 · Storm · Imagegen VFX · layered mockup only</p>
  </main>
  <script src="vfxManifest.js"></script>
  <script src="proceduralWeatherVfx.js"></script>
  <script src="imagegenWeatherVfx.js"></script>
  <script src="skylineWeatherComparison.js"></script>
</body>
</html>

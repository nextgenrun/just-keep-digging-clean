<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Level 1 living backgrounds - Understar</title><link rel="stylesheet" href="./styles.css"></head>
<body>
<header><div><p class="eyebrow">UNDERSTAR / LEVEL 1</p><h1>Living woodlands<span>Level 1 - from Town Square to the eastern boundary.</span></h1></div>
<div class="switch" aria-label="Rendering comparison"><button data-mode="baseline">Previous background</button><button data-mode="candidate" class="selected">In-game background</button></div></header>
<main><div id="viewport"><iframe id="game" title="Understar game background review" allow="autoplay; fullscreen"></iframe><div id="navigate" aria-label="Drag to explore the world"></div>
<div id="loading">Preparing the world...</div><div id="caption"><span id="region">Moonlit promenade</span><small id="hint">Drag to explore  -  Arrow keys to travel</small></div></div>
<footer><div class="controls"><button id="tour">Slow travel</button><button id="pause">Hold atmosphere</button><button id="play">Play here</button><select id="bookmark" aria-label="World location"></select></div>
<div class="environment-controls"><label>Time <select id="time" aria-label="Time of day"><option value="">World clock</option></select></label><label>Weather <select id="weather" aria-label="Weather"><option value="">World weather</option></select></label><span>Level 1 - continuous woodland, wind and atmosphere</span></div>
<div class="sliders"><label>West <input id="position" type="range" min="7" max="126" step=".1" value="47"> East</label><label>Sky <input id="altitude" type="range" min="6" max="63" step=".1" value="63"> Ground</label></div>
<div class="note"><span id="status">Loading the real game scene</span><span>Level 1 backgrounds  -  Town video preserved</span></div></footer></main>
<script type="module" src="./main.js?rev=20260906-level-one-live-v6"></script></body></html>

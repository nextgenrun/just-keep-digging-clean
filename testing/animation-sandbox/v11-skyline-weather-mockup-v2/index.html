<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>V11 skyline · weather cycle mockup</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="shell">
    <header>
      <p class="eyebrow">Layered motion study · mockup only</p>
      <h1>Skyline weather cycle</h1>
      <p class="lede">Rotors sit behind the authored towers. Time and weather now move the whole scene together.</p>
    </header>
    <section class="stage" id="skyline-stage" aria-label="Animated v11 skyline weather mockup">
      <img class="layer base" src="assets/skyline-base-clean.webp" alt="V11 village skyline">
      <canvas class="layer" id="deep-canvas" width="1001" height="430"></canvas>
      <img class="layer" src="assets/town-foreground.png" alt="">
      <canvas class="layer" id="rotor-canvas" width="1001" height="430"></canvas>
      <img class="layer" src="assets/windmill-foreground.png" alt="">
      <canvas class="layer" id="front-canvas" width="1001" height="430"></canvas>
      <div class="layer grade" id="grade"></div>
    </section>
    <section class="controls" aria-label="Mockup controls">
      <label class="toggle"><input id="motion-toggle" type="checkbox" checked> Motion</label>
      <label class="toggle"><input id="cycle-toggle" type="checkbox"> Auto cycle</label>
      <label>Time <input id="time" type="range" min="0" max="24" step="0.1" value="20"><output id="time-value">20:00</output></label>
      <label>Weather <select id="weather"><option value="clear">Clear</option><option value="cloudy">Cloudy</option><option value="rain">Rain</option><option value="storm" selected>Storm</option><option value="fog">Fog</option><option value="snow">Snow</option></select></label>
      <label>Strength <input id="intensity" type="range" min="0.4" max="2" step="0.1" value="1.3"><output id="intensity-value">1.3×</output></label>
    </section>
    <p class="status" id="status">20:00 · Storm · strong west wind</p>
  </main>
  <script src="weatherMockup.js"></script>
</body>
</html>

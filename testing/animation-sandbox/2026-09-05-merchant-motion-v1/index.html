<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Merchant Motion · Dig Game Sandbox</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="sandbox.css">
</head>
<body data-background="dark">
  <main>
    <header class="page-heading">
      <div><p class="eyebrow">JUST KEEP DIGGING / ANIMATION REVIEW</p><h1>Merchant motion</h1></div>
      <div class="heading-meta"><span class="review-badge">SANDBOX ONLY</span><span id="status" role="status">Loading 6 merchants…</span></div>
    </header>
    <section class="toolbar" aria-label="Animation controls">
      <div class="control-group"><button id="pause" type="button" aria-pressed="false">Pause</button><button id="replay" class="primary" type="button">Play gestures</button></div>
      <label>Motion<select id="mode"><option value="natural">Natural timing</option><option value="idle">Calm idle</option><option value="gestures">Gesture preview</option></select></label>
      <label>Speed<select id="speed"><option value="0.25">0.25×</option><option value="0.5">0.5×</option><option value="1" selected>1×</option></select></label>
      <label>Scale<select id="size"><option value="fit">Detail</option><option value="game">Game size</option></select></label>
      <label>Backdrop<select id="background"><option value="dark">Dark</option><option value="light">Light</option><option value="checker">Checker</option></select></label>
      <button id="compare" type="button" aria-pressed="false">Compare idles</button>
    </section>
    <div class="timeline-row"><button id="back" type="button" hidden>← All merchants</button><label class="timeline-label" for="timeline">Timeline</label><input id="timeline" type="range" min="0" max="18" step="0.02" value="0"><label class="seconds-label"><input id="seconds" aria-label="Time in seconds" type="number" min="0" max="18" step="0.05" value="0">s</label><span id="time-status">Playing</span></div>
    <section id="merchants" class="merchant-grid" aria-label="All six merchant animations"></section>
    <footer class="page-footer"><p>Original paintings with articulated motion. Compare shows existing idle videos; Magma has a still baseline.</p><div><span id="actual-size"></span><span id="fps">Starting…</span></div></footer>
  </main>
  <script type="module" src="main.js"></script>
</body>
</html>

<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Quickslash Q Regression Harness</title>
  <style>
    html, body { min-height: 100%; margin: 0; }
    body {
      display: grid;
      place-items: center;
      background: #080d13;
      color: #d9f4ff;
      font: 18px/1.45 Consolas, monospace;
    }
    main {
      width: min(720px, calc(100vw - 48px));
      padding: 32px;
      border: 1px solid #4f8297;
      background: #111c26;
      box-shadow: 0 16px 70px #000a;
    }
    h1 { margin-top: 0; color: #f1d98a; }
    kbd { padding: 3px 9px; border: 1px solid #9dc9d8; border-radius: 4px; }
    pre { white-space: pre-wrap; color: #b9deea; }
    [data-result="pass"] { color: #7ff0a6; }
  </style>
</head>
<body tabindex="0">
  <main>
    <h1>Quickslash input regression</h1>
    <p>Press or hold <kbd>Q</kbd>. The harness uses the production PlayerInput and PlayerAbilities modules.</p>
    <p id="result">Waiting for Q input…</p>
    <pre id="status"></pre>
  </main>
  <script type="module" src="./2026-08-27-quickslash-q-browser-harness.js"></script>
</body>
</html>
